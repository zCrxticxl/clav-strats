name: release

# Builds, signs and publishes a Tauri release whenever you push a tag like v1.0.2.
# GitHub does the whole build + sign + upload + latest.json generation for you.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          # react-scripts treats lint warnings as build errors when CI=true
          # (GitHub sets it). Keep the release build from failing on warnings.
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add these two under Settings -> Secrets and variables -> Actions:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clav.Strats ${{ github.ref_name }}"
          releaseBody: "Download the setup .exe below to install. Existing installs update automatically."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify published updater release
        run: npm run verify:updater -- --expect-version "${{ github.ref_name }}"
