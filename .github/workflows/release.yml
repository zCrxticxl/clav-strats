name: release

# Builds, signs and publishes a Tauri release whenever you push a tag like v1.0.1.
# GitHub does the whole build + sign + upload + latest.json generation for you.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # react-scripts treats lint warnings as build errors when CI=true
          # (GitHub sets it). Keep the release build from failing on warnings.
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add these two under Settings -> Secrets and variables -> Actions:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clav.Strats ${{ github.ref_name }}"
          releaseBody: "Download the setup .exe below to install. Existing installs update automatically."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
